[supervisord]
nodaemon=false
logfile=/home/user/webapp/supervisord.log
pidfile=/home/user/webapp/supervisord.pid
user=user

[unix_http_server]
file=/home/user/webapp/supervisor.sock

[supervisorctl]
serverurl=unix:///home/user/webapp/supervisor.sock

[rpcinterface:supervisor]
supervisor.rpcinterface_factory = supervisor.rpcinterface:make_main_rpcinterface

[program:slideflow_webapp]
command=python app.py
directory=/home/user/webapp
autostart=true
autorestart=true
stdout_logfile=/home/user/webapp/slideflow_webapp.log
stderr_logfile=/home/user/webapp/slideflow_webapp_error.log
environment=FLASK_ENV=production,FLASK_DEBUG=false

[program:medical_lab_education]
command=python app.py
directory=/home/user/webapp/medical_lab_education
autostart=true
autorestart=true
stdout_logfile=/home/user/webapp/medical_lab_education.log
stderr_logfile=/home/user/webapp/medical_lab_education_error.log
environment=FLASK_ENV=production,FLASK_DEBUG=false